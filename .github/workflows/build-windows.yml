name: Build Lekisa for Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: lekisa-desktop
      - uses: actions/checkout@v4
        if: ${{ vars.MOBILE_REPO != '' }}
        with:
          repository: ${{ vars.MOBILE_REPO }}
          token: ${{ secrets.MOBILE_TOKEN || github.token }}
          path: lekisa-pilot
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: lekisa-desktop
        run: npm install
      - name: Build installer
        working-directory: lekisa-desktop
        run: npm run dist
        env:
          LEKISA_MOBILE: ${{ vars.MOBILE_REPO != '' && '../lekisa-pilot' || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Lekisa-Windows-Installer
          path: lekisa-desktop/dist/*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: lekisa-desktop/dist/*.exe
